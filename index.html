<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TILSIM TEST Javoblar varag‘i</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600;6..72,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* TILSIM TEST javoblar varag'i (mini ilova namunasi)
   Tuzilma: 1-32 (A-D), 33-35 (A-F), 36-39 va 40a-44b ochiq javob, esse bali (0-75).
   Palette: binafsha (tanlangan javob, sarlavha), oltin (joriy holat, yakunlash), iliq oq fon.
   Rang farqlash ishonchli bo'lishi uchun to'g'ri/xato belgisi ✓ ✗ bilan beriladi. */
:root{
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Newsreader',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#f6f2f8; --surface:#ffffff; --surface-2:#faf7fc;
  --ink:#241530; --muted:#6a5c78; --line:#e1d8e9;
  --head:#3f2559; --head-ink:#ffffff; --head-muted:#cdbde0;
  --accent:#3f2559; --accent-ink:#ffffff; --sel:#f0e8f7;
  --gold:#c4922a; --gold-ink:#2a1d02; --gold-soft:#fbf0d6;
  --ok:#7a5208; --ok-soft:#fbf0d6; --bad:#3f2559; --bad-soft:#ece3f5;
  --ring:#c4922a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150d1e; --surface:#1e1329; --surface-2:#190f23;
    --ink:#efe8f5; --muted:#a99bb8; --line:#33224a;
    --head:#2a1740; --head-ink:#ffffff; --head-muted:#bda8d3;
    --accent:#7b4fb3; --accent-ink:#ffffff; --sel:#2b1c42;
    --gold:#e3b24a; --gold-ink:#2a1d02; --gold-soft:#2b2414;
    --ok:#e3b24a; --ok-soft:#2b2414; --bad:#d1b3f0; --bad-soft:#2e1f45;
    --ring:#e3b24a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150d1e; --surface:#1e1329; --surface-2:#190f23;
  --ink:#efe8f5; --muted:#a99bb8; --line:#33224a;
  --head:#2a1740; --head-ink:#ffffff; --head-muted:#bda8d3;
  --accent:#7b4fb3; --accent-ink:#ffffff; --sel:#2b1c42;
  --gold:#e3b24a; --gold-ink:#2a1d02; --gold-soft:#2b2414;
  --ok:#e3b24a; --ok-soft:#2b2414; --bad:#d1b3f0; --bad-soft:#2e1f45;
  --ring:#e3b24a; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body)}
body{padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);border-bottom:3px solid var(--gold)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 1.15rem var(--f-display);letter-spacing:.03em;white-space:nowrap}
.brand b{color:var(--gold)}
.top-t{min-width:0;text-align:right;font-size:.85rem;color:var(--head-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.wrap{max-width:1040px;margin:0 auto;padding-block:22px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.list{padding:22px 24px}
.title{font:700 1.7rem/1.15 var(--f-display);text-wrap:balance}
.sub{color:var(--muted);margin-top:4px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-h h2{font:700 1.15rem var(--f-display)}
.sec-h span{font-size:.82rem;color:var(--muted)}

.row{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:8px;padding:9px 0;scroll-margin-top:90px}
.num{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.opts{display:flex;gap:8px}
.opt{flex:1 1 0;min-width:0;height:46px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;font-weight:800;letter-spacing:.02em;transition:background .12s,border-color .12s}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.txt{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px}
.txt:focus{border-color:var(--accent)}
.txt.has{border-color:var(--accent);background:var(--sel)}

.essay{margin-top:26px;padding:16px;border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:12px}
.essay label{display:block;font-weight:700;margin-bottom:8px}
.essay input{width:100%;max-width:220px;height:46px;padding:0 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font:600 1.05rem var(--f-mono)}
.btn{min-height:50px;padding:0 22px;border-radius:10px;border:1.5px solid var(--gold);background:var(--gold);color:var(--gold-ink);font-weight:800;letter-spacing:.01em}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.block{width:100%;margin-top:22px;min-height:54px;font-size:1.02rem}

.panel{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));padding:16px}
.panel-h{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;padding:0}
.panel-h b{font:700 1.1rem var(--f-display)}
.panel-h span{font-size:.88rem;color:var(--muted)}
.panel-h span b{font:700 .88rem var(--f-body);color:var(--ink)}
.bar{height:5px;border-radius:3px;background:var(--line);margin:10px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:calc(100vh - 210px);overflow:auto;padding:2px}
.cell{height:40px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;font-size:.84rem}
.cell:hover{border-color:var(--muted)}
.cell.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chev{display:none}

/* natija */
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);overflow:hidden}
.res-a{background:var(--head);color:var(--head-ink);padding:28px;display:flex;flex-direction:column;gap:8px}
.res-a .eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.pct{font:700 clamp(3.4rem,10vw,5rem)/1 var(--f-display)}
.pct span{font-size:.5em;color:var(--gold);margin-left:4px}
.res-a p{color:var(--head-muted)}
.res-b{padding:28px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.rb{display:flex;flex-direction:column;gap:6px}
.rb-h{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:.94rem}
.rb-h span:last-child{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.rb-bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.rb-bar i{display:block;height:100%;background:var(--accent)}
.rev-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.rev-h h2{font:700 1.35rem var(--f-display)}
.rev-h label{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem;cursor:pointer}
.rev-h input{accent-color:var(--accent);width:18px;height:18px}
.rv{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.rv-n{font-weight:800;color:var(--muted)}
.rv-a{font-size:.94rem;overflow-wrap:anywhere}
.rv-a .m{font-family:var(--f-mono)}
.tag{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}
.rv.ok .tag{background:var(--ok-soft);color:var(--ok)}
.rv.no .tag{background:var(--bad-soft);color:var(--bad)}
.rv.skip .tag{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.only .rv.ok{display:none}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,5,18,.6);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.mbox h2{font:700 1.35rem var(--f-display)}
.mrow{display:flex;justify-content:space-between;padding:9px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.mrow b{font-family:var(--f-mono)}
.mact{display:flex;gap:10px;flex-wrap:wrap}
.mact .btn{flex:1 1 140px}
.sent{padding:36px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.sent h2{font:700 1.6rem var(--f-display)}
.sent p{color:var(--muted);max-width:420px}
.note{margin-top:16px;font-size:.82rem;color:var(--muted)}

@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .panel{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:15;order:-1;padding:10px 14px}
  .panel-h{flex-direction:row;justify-content:space-between;align-items:center}
  .chev{display:inline;color:var(--muted)}
  .pgrid{display:none;margin-top:10px;max-height:46vh;grid-template-columns:repeat(6,1fr)}
  .panel.open .pgrid{display:grid}
  .bar{margin:8px 0 0}
  .res{grid-template-columns:minmax(0,1fr)}
  .list{padding:16px}
}
@media (max-width:480px){
  .row{grid-template-columns:36px minmax(0,1fr);gap:6px}
  .opts{gap:5px}.opt{height:44px;border-radius:8px}
  .rv{grid-template-columns:40px minmax(0,1fr)}
  .rv .tag{grid-column:2;justify-self:start}
  .top-t{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">TILSIM <b>TEST</b></div>
  <div class="top-t" id="top-t">Javoblar varag‘i</div>
</div></header>

<main class="wrap">
  <div id="form" class="grid">
    <section class="card list">
      <h1 class="title" id="ttl">Test savollari</h1>
      <p class="sub" id="sub"></p>
      <div id="rows"></div>
      <div class="essay" id="essay-box">
        <label for="essay">Esse ballingizni kiriting <span class="hint" style="font-weight:500;color:var(--muted)">(75 ballik shkalada)</span></label>
        <input id="essay" type="text" inputmode="numeric" placeholder="Masalan: 65" autocomplete="off">
      </div>
      <button type="button" id="finish" class="btn block">✓ Testni yakunlash</button>
    </section>
    <aside id="panel" class="card panel" aria-label="Savollar holati">
      <button type="button" class="panel-h" id="panel-h" aria-expanded="false">
        <b>Savollar holati <span class="chev">▾</span></b>
        <span>Belgilangan: <b id="c-done">0</b> · Qolgan: <b id="c-left">49</b></span>
      </button>
      <div class="bar"><i id="bar"></i></div>
      <div class="pgrid" id="pgrid"></div>
    </aside>
  </div>

  <div id="result" hidden></div>
</main>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="mbox">
    <h2 id="mt">Testni yakunlaysizmi?</h2>
    <div id="mbody" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="mact">
      <button type="button" class="btn ghost" id="m-no">Qaytish</button>
      <button type="button" class="btn" id="m-yes">Ha, yakunlash</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  var inTg = !!(tg && typeof tg.sendData === 'function' && tg.platform && tg.platform !== 'unknown');
  if (tg) {
    try { tg.ready(); tg.expand(); if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme); } catch (e) {}
  }
  var params = new URLSearchParams(location.search);
  var MODE = params.get('mode') === 'key' ? 'key' : 'answer';
  var TPL = params.get('tpl') === 'att' ? 'att' : 'rasch';
  var CODE = (params.get('code') || '').replace(/[^\d]/g, '').slice(0, 9);
  var NAME = (params.get('name') || 'Test').slice(0, 60);
  var LS = 'tilsim-varaq-' + MODE + '-' + TPL + '-' + (MODE === 'key' ? 'draft' : (CODE || 'x'));

  var ITEMS = [], i, n;
  if (TPL === 'att') {
    for (i = 1; i <= 50; i++) ITEMS.push({ id: String(i), type: 'mc', opts: 4 });
  } else {
    for (i = 1; i <= 35; i++) ITEMS.push({ id: String(i), type: 'mc', opts: i <= 32 ? 4 : 6 });
    for (i = 36; i <= 39; i++) ITEMS.push({ id: String(i), type: 'open' });
    for (n = 40; n <= 44; n++) { ITEMS.push({ id: n + 'a', type: 'open' }); ITEMS.push({ id: n + 'b', type: 'open' }); }
  }
  var L = 'ABCDEF';
  var HAS_ESSAY = TPL === 'rasch' && MODE === 'answer';

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var A = {}, essay = '', sent = false;
  function load() { try { var o = JSON.parse(localStorage.getItem(LS)); if (o) { A = o.A || {}; essay = o.essay || ''; sent = MODE === 'answer' && !!o.sent; } } catch (e) {} }
  function save() { try { localStorage.setItem(LS, JSON.stringify({ A: A, essay: essay, sent: sent })); } catch (e) {} }
  function wipe() { try { localStorage.removeItem(LS); } catch (e) {} }

  function renderRows() {
    var h = '', ph = MODE === 'key' ? 'To‘g‘ri javobni kiriting' : 'Javobni kiriting';
    ITEMS.forEach(function (it) {
      if (TPL === 'att') {
        if (it.id === '1') h += '<div class="sec-h"><h2>Asosiy fan</h2><span>1–35</span></div>';
        if (it.id === '36') h += '<div class="sec-h"><h2>Kasbiy standart</h2><span>36–40</span></div>';
        if (it.id === '41') h += '<div class="sec-h"><h2>Pedagogik mahorat</h2><span>41–50</span></div>';
      } else {
        if (it.id === '1') h += '<div class="sec-h"><h2>Yopiq savollar</h2><span>1–35</span></div>';
        if (it.id === '36') h += '<div class="sec-h"><h2>Ochiq savollar</h2><span>36–44b · ' + (MODE === 'key' ? 'to‘g‘ri javobni yozing' : 'javobni o‘zingiz yozasiz') + '</span></div>';
      }
      h += '<div class="row" id="r-' + it.id + '"><div class="num">' + it.id + '.</div>';
      if (it.type === 'mc') {
        h += '<div class="opts" role="group" aria-label="' + it.id + '-savol">';
        for (var j = 0; j < it.opts; j++) h += '<button type="button" class="opt" data-id="' + it.id + '" data-v="' + L[j] + '" aria-pressed="' + (A[it.id] === L[j]) + '">' + L[j] + '</button>';
        h += '</div>';
      } else {
        h += '<input class="txt' + (A[it.id] ? ' has' : '') + '" data-id="' + it.id + '" type="text" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + ph + '" aria-label="' + it.id + '-savol javobi" value="' + esc(A[it.id] || '') + '">';
      }
      h += '</div>';
    });
    $('#rows').innerHTML = h;
    $('#essay').value = essay;
  }

  function renderPanel() {
    var cnt = 0;
    $('#pgrid').innerHTML = ITEMS.map(function (it) {
      var on = !!A[it.id]; if (on) cnt++;
      return '<button type="button" class="cell' + (on ? ' on' : '') + '" data-go="' + it.id + '">' + it.id + '</button>';
    }).join('');
    $('#c-done').textContent = cnt;
    $('#c-left').textContent = ITEMS.length - cnt;
    $('#bar').style.width = (cnt / ITEMS.length * 100) + '%';
  }

  $('#rows').addEventListener('click', function (e) {
    var b = e.target.closest('.opt');
    if (!b) return;
    var id = b.dataset.id, v = b.dataset.v;
    if (A[id] === v) delete A[id]; else A[id] = v;
    save();
    Array.prototype.forEach.call(document.querySelectorAll('.opt[data-id="' + id + '"]'), function (x) { x.setAttribute('aria-pressed', String(A[id] === x.dataset.v)); });
    renderPanel();
  });
  $('#rows').addEventListener('input', function (e) {
    var t = e.target;
    if (!t.classList.contains('txt')) return;
    if (t.value.trim() === '') delete A[t.dataset.id]; else A[t.dataset.id] = t.value;
    t.classList.toggle('has', !!A[t.dataset.id]);
    save(); renderPanel();
  });
  $('#essay').addEventListener('input', function (e) {
    var v = e.target.value.replace(/[^\d]/g, '').slice(0, 2);
    if (e.target.value !== v) e.target.value = v;
    essay = v; save();
  });
  $('#pgrid').addEventListener('click', function (e) {
    var c = e.target.closest('.cell');
    if (!c) return;
    var r = document.getElementById('r-' + c.dataset.go);
    if (r) r.scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('#panel').classList.remove('open');
    $('#panel-h').setAttribute('aria-expanded', 'false');
  });
  $('#panel-h').addEventListener('click', function () {
    if (window.innerWidth > 860) return;
    var o = $('#panel').classList.toggle('open');
    $('#panel-h').setAttribute('aria-expanded', String(o));
  });

  function missing() { return ITEMS.filter(function (it) { return !A[it.id]; }); }

  function openModal() {
    var left = missing().length, h = '';
    if (MODE === 'key') {
      h = '<div class="mrow"><span>Belgilanmagan kalit</span><b>' + left + ' ta</b></div>' +
        (left ? '<p style="font-size:.9rem;color:var(--muted)">Test yaratish uchun barcha savollarning to‘g‘ri javobi belgilanishi kerak.</p>'
              : '<p style="font-size:.9rem;color:var(--muted)">Kalitlar yuborilgach, bot test kodini beradi.</p>');
      $('#mt').textContent = left ? 'Kalitlar to‘liq emas' : 'Kalitlarni saqlaysizmi?';
      $('#m-yes').hidden = left > 0;
      $('#m-yes').textContent = 'Ha, saqlash';
      $('#m-no').textContent = left ? 'Davom etish' : 'Qaytish';
    } else {
      h = '<div class="mrow"><span>Javob berilmagan</span><b>' + left + ' ta</b></div>' +
        (HAS_ESSAY ? '<div class="mrow"><span>Esse bali</span><b>' + (essay !== '' ? essay + ' / 75' : 'kiritilmagan') + '</b></div>' : '') +
        '<p style="font-size:.9rem;color:var(--muted)">Yuborgandan keyin javoblarni o‘zgartirib bo‘lmaydi.</p>';
      $('#mt').textContent = 'Testni yakunlaysizmi?';
      $('#m-yes').hidden = false;
      $('#m-yes').textContent = 'Ha, yakunlash';
      $('#m-no').textContent = 'Qaytish';
    }
    $('#mbody').innerHTML = h;
    $('#modal').hidden = false;
    (left && MODE === 'key' ? $('#m-no') : $('#m-yes')).focus();
  }
  function closeModal() { $('#modal').hidden = true; }
  $('#finish').addEventListener('click', function () {
    if (!inTg || (MODE === 'answer' && !CODE)) { showInfo(); return; }
    openModal();
  });
  $('#m-no').addEventListener('click', function () {
    var first = MODE === 'key' ? missing()[0] : null;
    closeModal();
    if (first) { var r = document.getElementById('r-' + first.id); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  });
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

  $('#m-yes').addEventListener('click', function () {
    closeModal();
    var payload;
    if (MODE === 'key') {
      payload = { m: 'key', t: TPL, n: NAME, a: A };
      wipe();
    } else {
      payload = { c: CODE, a: A, e: HAS_ESSAY && essay !== '' ? parseInt(essay, 10) : null };
      sent = true; save();
    }
    showSent();
    try { tg.sendData(JSON.stringify(payload)); } catch (err) {}
  });

  function showSent() {
    $('#form').hidden = true;
    $('#result').hidden = false;
    $('#result').innerHTML = MODE === 'key'
      ? '<div class="card sent"><h2>Kalitlar yuborildi</h2><p>Test yaratildi. Test kodi bot orqali Telegram chatiga keladi. Bu oynani yopishingiz mumkin.</p></div>'
      : '<div class="card sent"><h2>Javoblaringiz yuborildi</h2><p>Natija bot orqali Telegram chatiga keladi. Bu oynani yopishingiz mumkin.</p></div>';
    window.scrollTo(0, 0);
  }
  function showInfo() {
    $('#mbody').innerHTML = '<p>Bu varaq faqat Telegram bot orqali ochiladi. Botdagi <b>“Varaq bilan ishlash”</b> yoki <b>“Kalit varag‘ini ochish”</b> tugmasidan foydalaning.</p>';
    $('#mt').textContent = 'Telegram orqali oching';
    $('#m-yes').hidden = true;
    $('#m-no').textContent = 'Yopish';
    $('#modal').hidden = false;
  }

  /* ---------- sarlavhalar ---------- */
  if (MODE === 'key') {
    $('#ttl').textContent = 'Kalit varag‘i';
    $('#sub').innerHTML = 'Test: <b>' + esc(NAME) + '</b> · ' + ITEMS.length + ' ta savol · to‘g‘ri javoblarni belgilang';
    $('#finish').textContent = '✓ Kalitlarni saqlash';
    $('#top-t').textContent = 'Test yaratish';
  } else {
    $('#sub').innerHTML = 'Test kodi: <b>' + (CODE || '—') + '</b> · ' + ITEMS.length + ' ta savol';
  }
  $('#essay-box').hidden = !HAS_ESSAY;

  load();
  renderRows();
  renderPanel();
  if (sent) showSent();
})();
</script>
</body>
</html>
